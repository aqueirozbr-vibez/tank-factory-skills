; Import contracts for fieldco/reading-api (TRD §4 Component map). INV-5 is the last contract.
[importlinter]
root_package = app

[importlinter:contract:readings-forbidden]
name = readings never imports anomalies, summaries or integrations
type = forbidden
source_modules = app.readings
forbidden_modules =
    app.anomalies
    app.summaries
    app.integrations

[importlinter:contract:anomalies-forbidden]
name = anomalies never imports integrations
type = forbidden
source_modules = app.anomalies
forbidden_modules = app.integrations

[importlinter:contract:assets-forbidden]
name = assets never imports readings or anomalies
type = forbidden
source_modules = app.assets
forbidden_modules =
    app.readings
    app.anomalies

[importlinter:contract:db-leaf]
name = db imports nothing else in app
type = forbidden
source_modules = app.db
forbidden_modules =
    app.readings
    app.anomalies
    app.assets
    app.summaries
    app.integrations

[importlinter:contract:registry-read-only]
name = only assets may import the registry client (INV-3, P-2)
type = forbidden
source_modules =
    app.readings
    app.anomalies
    app.summaries
forbidden_modules = app.integrations.registry

[importlinter:contract:summaries-never-decide]
name = INV-5 summaries never imports decision code
type = forbidden
source_modules = app.summaries
forbidden_modules =
    app.anomalies
    app.readings
